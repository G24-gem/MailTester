<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Sender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
    }
    button {
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Send Email</h3>
    <input type="email" id="to" placeholder="Recipient email" />
    <input type="text" id="subject" placeholder="Subject" />
    <textarea id="text" placeholder="Message"></textarea>
    <button onclick="sendEmail()">Send</button>
    <p id="status"></p>
  </div>

  <script>
    async function sendEmail() {
      const to = document.getElementById('to').value;
      const subject = document.getElementById('subject').value;
      const text = document.getElementById('text').value;

      const status = document.getElementById('status');
      status.innerText = 'Sending...';

      try {
        const res = await fetch('/send-email', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ to, subject, text })
        });

        const data = await res.json();
        status.innerText = data.message || 'Done';
      } catch (err) {
        status.innerText = 'Error sending email';
      }
    }
  </script>
</body>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Sender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    #google-btn {
      background: #4285F4;
      color: white;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 10px;
    }
    #logout-btn {
      background: #cc0000;
    }
    #form-section {
      display: none;
    }
    #login-section {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Email Sender</h3>

    <!-- Login Section -->
    <div id="login-section">
      <p>Login with your Google account to send emails.</p>
      <div id="google-btn" onclick="loginWithGoogle()">
        🔐 Login with Google
      </div>
    </div>

    <!-- Form Section (shown after login) -->
    <div id="form-section">
      <p id="logged-in-msg" style="color:green; font-size:13px;"></p>
      <input type="email" id="to" placeholder="Recipient email" />
      <input type="text" id="subject" placeholder="Subject" />
      <textarea id="html" placeholder="Write HTML e.g. <h1>Hello</h1>"></textarea>>
      <button onclick="sendEmail()">Send</button>
      <button id="logout-btn" onclick="logout()">Logout</button>
      <p id="status"></p>
    </div>
  </div>

  <script>
    // Check login status on page load
    window.onload = async () => {
      const res = await fetch('/auth/status');
      const data = await res.json();
      if (data.loggedIn) {
        showForm(data.email);
      } else {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('form-section').style.display = 'none';
      }
    };

    function loginWithGoogle() {
      window.location.href = '/auth/google';
    }

    async function logout() {
      await fetch('/auth/logout');
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('form-section').style.display = 'none';
    }

    function showForm(email) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('form-section').style.display = 'block';
      if (email) {
        document.getElementById('logged-in-msg').innerText = `Logged in as ${email}`;
      }
    }

    async function sendEmail() {
      const to = document.getElementById('to').value;
      const subject = document.getElementById('subject').value;
      const text = document.getElementById('text').value;
      const status = document.getElementById('status');
      status.innerText = 'Sending...';

      try {
        const res = await fetch('/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to, subject, text })
        });

        const data = await res.json();
        if (res.status === 401) {
          status.innerText = 'Please login first!';
        } else {
          status.innerText = data.message || 'Done';
        }
      } catch (err) {
        status.innerText = 'Error sending email';
      }
    }
  </script>
</body>
</html>
